<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f6f8ee">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>题灵录</title>
<style>
:root{
  /* 护眼清爽（默认）· 温润纸感 × 低蓝光 */
  --bg-top:#f6f8ee; --bg-mid:#f1f4e8; --bg-bottom:#ebf0de;
  --bg-fx:radial-gradient(60% 42% at 8% -10%,#eef4dd 0%,rgba(238,244,221,0) 62%),
          radial-gradient(56% 40% at 96% 0%,#e8f0e2 0%,rgba(232,240,226,0) 64%),
          linear-gradient(180deg,#f6f8ee 0%,#f1f4e8 55%,#ebf0de 100%);
  --dot:rgba(120,140,90,.10);
  --card:#fcfcf4; --card-solid:#fcfcf4; --card-border:rgba(95,120,75,.12);
  --card-shadow:0 8px 24px -16px rgba(70,90,50,.20),0 2px 6px rgba(70,90,50,.04);
  --primary:#3a6b45; --primary-soft:#e6efdc; --accent:#2f6f78; --teal:#2f6f78; --coral:#a8503a;
  --text:#2b352c; --text-sub:#5a6b58; --line:#e2e9d8;
  --ok:#2f7048; --ok-bg:#e4f0e0; --err:#a8382a; --err-bg:#f7e6e0; --warn:#8a5f16;
  --panel:rgba(252,252,244,.90); --panel-glass:rgba(252,252,244,.76);
  --chip-sub:#eef3e4; --chip-multi:#e2efe4; --chip-judge:#e7eff0; --chip-essay:#f6efe0; --qn-un:#f2f6ea;
  --hero1:#3a6b45; --hero2:#2f6f78;
  --btn1:#3a6b45; --btn2:#2f6f78;
}
/* ===== 外观主题 ===== */
/* 夜阑 · 深蓝 × 青（夜间使用） */
body[data-theme="night"]{
  --bg-top:#0f131a; --bg-mid:#12161d; --bg-bottom:#151a22;
  --bg-fx:radial-gradient(58% 42% at 8% -10%,rgba(45,110,150,.30) 0%,rgba(45,110,150,0) 62%),
          radial-gradient(52% 38% at 96% 2%,rgba(40,140,130,.22) 0%,rgba(40,140,130,0) 64%),
          linear-gradient(180deg,#0f131a 0%,#12161d 55%,#151a22 100%);
  --dot:rgba(255,255,255,.05);
  --card:#1a1f28; --card-solid:#1a1f28; --card-border:rgba(255,255,255,.08);
  --card-shadow:0 12px 30px -16px rgba(0,0,0,.8),0 2px 8px rgba(0,0,0,.35);
  --primary:#6db3f2; --primary-soft:#1e2b3a; --accent:#3fb8a8; --teal:#3fb8a8; --coral:#f0836f;
  --text:#e6ecf5; --text-sub:#94a3b8; --line:#28303c;
  --ok:#4ade80; --ok-bg:#14301f; --err:#f87171; --err-bg:#3a1a1a; --warn:#fbbf24;
  --panel:rgba(18,22,29,.88); --panel-glass:rgba(18,22,29,.74);
  --chip-sub:#232b36; --chip-multi:#1b3330; --chip-judge:#1e2b3a; --chip-essay:#33291a; --qn-un:#212833;
  --hero1:#1d3f63; --hero2:#1f6b6b;
  --btn1:#2b6cb0; --btn2:#2c7a7b;
}
/* 碧海 · 晴空 × 深海（蓝色系，无粉） */
body[data-theme="ocean"]{
  --bg-top:#f3fbff; --bg-mid:#e8f4ff; --bg-bottom:#e3eefc;
  --bg-fx:radial-gradient(58% 42% at 8% -10%,#d8f0ff 0%,rgba(216,240,255,0) 62%),
          radial-gradient(54% 38% at 96% 0%,#d6e6ff 0%,rgba(214,230,255,0) 64%),
          linear-gradient(180deg,#f3fbff 0%,#e8f4ff 55%,#e3eefc 100%);
  --dot:rgba(70,140,200,.13);
  --card:#ffffff; --card-solid:#ffffff; --card-border:rgba(26,107,178,.10);
  --card-shadow:0 10px 30px -14px rgba(20,90,150,.20),0 2px 8px rgba(20,90,150,.04);
  --primary:#1a6bb2; --primary-soft:#dceeff; --accent:#0f8f8f; --teal:#0f8f8f; --coral:#d9694a;
  --text:#16394f; --text-sub:#4b6d84; --line:#d9ebfa;
  --ok:#197952; --ok-bg:#d9f6e8; --err:#c02a1e; --err-bg:#fde8e5; --warn:#96590c;
  --panel:rgba(255,255,255,.88); --panel-glass:rgba(255,255,255,.74);
  --chip-sub:#eaf5ff; --chip-multi:#ddf3f3; --chip-judge:#e4eefc; --chip-essay:#fdf0e0; --qn-un:#eef7ff;
  --hero1:#1a6bb2; --hero2:#0f8f8f;
  --btn1:#1a6bb2; --btn2:#0f8f8f;
}
/* 水墨 · 素纸 × 墨 × 朱（无粉） */
body[data-theme="shuimo"]{
  --bg-top:#fbfaf7; --bg-mid:#f5f5f2; --bg-bottom:#eeeeea;
  --bg-fx:radial-gradient(54% 38% at 6% -10%,#ffffff 0%,rgba(255,255,255,0) 60%),
          radial-gradient(48% 34% at 96% 2%,#e9efee 0%,rgba(233,239,238,0) 62%),
          linear-gradient(180deg,#fbfaf7 0%,#f5f5f2 55%,#eeeeea 100%);
  --dot:rgba(90,90,95,.09);
  --card:#ffffff; --card-solid:#ffffff; --card-border:#e3e3de;
  --card-shadow:0 6px 22px -14px rgba(50,50,55,.22),0 2px 6px rgba(50,50,55,.05);
  --primary:#2e2e36; --primary-soft:#ececef; --accent:#b93a2c; --teal:#5f7f79; --coral:#b93a2c;
  --text:#26262c; --text-sub:#6d6d75; --line:#e3e3de;
  --ok:#3d7658; --ok-bg:#e6f2ea; --err:#b8352a; --err-bg:#f8e4e1; --warn:#7d5c1a;
  --panel:rgba(255,255,255,.9); --panel-glass:rgba(255,255,255,.78);
  --chip-sub:#f1f1ee; --chip-multi:#e8efec; --chip-judge:#efeff1; --chip-essay:#f5efe2; --qn-un:#f5f5f2;
  --hero1:#2e2e36; --hero2:#5f7f79;
  --btn1:#2e2e36; --btn2:#4a4a52;
}
/* 夜间专用的几处补丁（浅色写死的地方） */
body[data-theme="night"] .hero-btn{background:rgba(255,255,255,.16);color:#fff;box-shadow:none;}
body[data-theme="night"] .hero::after{background:radial-gradient(120% 92% at 86% -18%,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 58%);}
body[data-theme="night"] .toast{background:rgba(38,46,58,.96);}
body[data-theme="night"] .mask{background:rgba(0,0,0,.62);}
body[data-theme="night"] pre.ex-pre{background:#212833;}
body[data-theme="night"] .btn-ghost{background:#212833;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;margin:0;padding:0;}
body{
  margin:0;padding:0;color:var(--text);min-height:100dvh;overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:16px;line-height:1.65;background:var(--bg-mid);
  overscroll-behavior-y:contain;
}
body::before{content:'';position:fixed;inset:0;z-index:-2;
  background:var(--bg-fx,linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 45%,var(--bg-bottom) 100%));
  background-attachment:fixed;}
/* 细点阵纹理 */
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(var(--dot,rgba(146,112,208,.18)) 1px,transparent 1px);
  background-size:22px 22px;opacity:.7;}

#app{max-width:720px;margin:0 auto;padding:0 18px calc(104px + env(safe-area-inset-bottom));}
@media (orientation:landscape){
  #app{padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right));}
}

/* ===== 顶栏 / 底栏（毛玻璃 + 纯色降级）===== */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;
  padding:calc(14px + env(safe-area-inset-top)) 2px 14px;
  background:var(--panel);border-bottom:0;box-shadow:0 1px 0 var(--line);}
@supports ((-webkit-backdrop-filter:blur(14px)) or (backdrop-filter:blur(14px))){
  .topbar{background:var(--panel-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
}
.topbar .tb-title{font-weight:800;font-size:17px;letter-spacing:.3px;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .tb-meta{font-size:12.5px;color:var(--text-sub);white-space:nowrap;letter-spacing:.2px;}
.btn-back{border:none;background:var(--primary-soft);color:var(--primary);border-radius:12px;
  padding:7px 12px;font-size:14px;font-weight:600;cursor:pointer;touch-action:manipulation;
  user-select:none;flex-shrink:0;line-height:1.4;}
.btn-back:active{transform:scale(.96);}
.botbar{position:fixed;left:0;right:0;bottom:0;z-index:60;}
.botbar-in.botbar-stack{flex-direction:column;align-items:stretch;gap:8px;flex-wrap:nowrap;}
.qb-tools{display:flex;gap:8px;}
.qb-tools .btn{flex:1;font-size:12.5px;padding:9px 4px;white-space:nowrap;}
.qb-acts{display:flex;gap:8px;}
.qb-acts .btn{font-size:14.5px;padding:12px 18px;}
.qb-acts .btn-primary{flex:1;}
.botbar-in{max-width:720px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center;
  padding:11px 18px calc(11px + env(safe-area-inset-bottom));
  background:var(--panel);border-top:0;box-shadow:0 -1px 0 var(--line),0 -10px 26px -16px rgba(20,60,90,.22);}
@supports ((-webkit-backdrop-filter:blur(14px)) or (backdrop-filter:blur(14px))){
  .botbar-in{background:var(--panel-glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);}
}
body.kb-open .botbar{display:none;}

/* ===== 按钮 / 表单 ===== */
.btn{border:none;border-radius:14px;padding:12px 20px;font-size:15.5px;font-weight:600;letter-spacing:.2px;
  cursor:pointer;touch-action:manipulation;user-select:none;font-family:inherit;line-height:1.35;
  transition:transform .12s ease,box-shadow .12s ease,background .12s ease;}
.btn:active{transform:scale(.975);}
.btn-primary{background:linear-gradient(135deg,var(--btn1,var(--primary)),var(--btn2,var(--accent)));color:#fff;
  box-shadow:0 12px 24px -12px rgba(24,86,64,.55);}
.btn-ghost{background:var(--card-solid,#fff);color:var(--primary);border:1.5px solid var(--primary);}
.btn-plain{background:var(--primary-soft);color:var(--primary);}
.btn-danger{background:var(--card-solid,#fff);color:var(--err);border:1.5px solid var(--err);}
.btn-sm{padding:8px 14px;font-size:13.5px;border-radius:11px;}
.btn-big{flex:1;padding:15px 10px;font-size:16.5px;}
.btn[disabled],.btn.disabled{opacity:.4;pointer-events:none;}
.btn-link{border:none;background:none;color:var(--primary);font-size:13.5px;font-weight:600;cursor:pointer;
  padding:4px 6px;touch-action:manipulation;}
input,select,textarea{font-size:16px;font-family:inherit;padding:11px 13px;border:1.5px solid var(--line);
  border-radius:12px;background:var(--card-solid,#fff);color:var(--text);width:100%;line-height:1.5;
  transition:border-color .15s ease,box-shadow .15s ease;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft);}
label.fl{display:block;font-size:13px;font-weight:600;color:var(--text-sub);margin:12px 0 6px;letter-spacing:.2px;}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.row>*{flex-shrink:0;}

/* ===== 卡片与通用 ===== */
.card{background:var(--card);border:0;border-radius:20px;
  box-shadow:var(--card-shadow);padding:20px;margin:14px 0;}
.card-sm{border-radius:16px;padding:15px;}
.card-tap{cursor:pointer;touch-action:manipulation;user-select:none;}
.card-tap:active{background:var(--primary-soft);}
.muted{color:var(--text-sub);font-size:13px;}
.big-num{font-size:26px;font-weight:700;color:var(--primary);}
.chip{display:inline-block;font-size:11.5px;font-weight:600;line-height:1;padding:5px 10px;
  border-radius:999px;letter-spacing:.2px;background:var(--primary-soft);color:var(--primary);
  margin-right:6px;white-space:nowrap;}
.chip.c-sub{background:var(--chip-sub,#eef4f8);color:var(--text-sub);}
.chip.c-type-single{background:var(--primary-soft);color:var(--primary);}
.chip.c-type-multiple{background:var(--chip-multi,#e2f4f1);color:var(--teal);}
.chip.c-type-judge{background:var(--chip-judge,#e8f5f8);color:var(--accent);}
.chip.c-type-blank{background:var(--ok-bg);color:var(--ok);}
.chip.c-type-essay{background:var(--chip-essay,#faf1e6);color:var(--warn);}
.chip.c-type-sub{background:var(--chip-essay,#faf1e6);color:var(--warn);}
.chip.c-wrong{background:var(--err-bg);color:var(--err);}
.chip.c-fav{background:var(--chip-essay);color:var(--warn);}
.q-text{font-size:17px;line-height:1.7;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text;}
.analysis{background:var(--primary-soft);border-radius:12px;padding:12px 14px;font-size:15px;
  line-height:1.7;color:var(--text);white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text;}
.analysis .a-t{font-weight:700;color:var(--primary);display:block;margin-bottom:4px;}

/* ===== 首页 ===== */
.home-top{padding:calc(20px + env(safe-area-inset-top)) 2px 0;}
.home-date{font-size:12px;color:var(--text-sub);letter-spacing:.6px;}
.home-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px;}
.home-row h1{font-size:32px;margin:0;letter-spacing:3px;font-weight:800;line-height:1.1;color:var(--text);}
.icon-btn{width:40px;height:40px;border:0;border-radius:50%;background:var(--card);color:var(--text);
  box-shadow:var(--card-shadow);display:flex;align-items:center;justify-content:center;cursor:pointer;
  touch-action:manipulation;flex-shrink:0;padding:0;}
.icon-btn:active{transform:scale(.94);}

.hero{position:relative;overflow:hidden;margin:16px 0 22px;border-radius:26px;padding:20px 20px 22px;
  background:linear-gradient(135deg,var(--hero1,var(--primary)) 0%,var(--hero1,var(--primary)) 38%,var(--hero2,var(--accent)) 100%);
  box-shadow:0 22px 44px -24px var(--primary);}
.hero::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(120% 92% at 86% -18%,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 58%);}
.hero-kicker{font-size:12px;color:rgba(255,255,255,.82);letter-spacing:.5px;position:relative;z-index:1;}
.hero-num{font-size:46px;font-weight:800;color:#fff;line-height:1.02;margin-top:5px;
  letter-spacing:-1.5px;font-variant-numeric:tabular-nums;position:relative;z-index:1;}
.hero-num span{font-size:14px;font-weight:600;margin-left:6px;opacity:.74;letter-spacing:.5px;}
.hero-sub{font-size:12.5px;color:rgba(255,255,255,.88);margin-top:8px;position:relative;z-index:1;}
.hero-btn{margin-top:18px;border:0;border-radius:999px;padding:12px 26px;font-size:14px;font-weight:800;
  color:var(--primary);font-family:inherit;cursor:pointer;touch-action:manipulation;position:relative;z-index:1;
  background:#fff;box-shadow:0 10px 22px -10px rgba(20,10,40,.35);}
.hero-btn:active{transform:scale(.97);}
/* 题库为空时的浅色引导卡（跟随主题） */
.hero-empty{margin:16px 0 22px;border-radius:24px;padding:20px;
  background:linear-gradient(158deg,var(--primary-soft) 0%,var(--card) 74%);
  border:1.5px dashed var(--card-border);}
.he-top{display:flex;align-items:center;gap:13px;}
.he-ico{width:44px;height:44px;border-radius:15px;flex:none;display:flex;align-items:center;
  justify-content:center;color:#fff;background:linear-gradient(135deg,var(--btn1,var(--primary)),var(--btn2,var(--accent)));
  box-shadow:0 10px 20px -12px var(--primary);}
.he-tx{min-width:0;}
.he-tx b{display:block;font-size:15px;font-weight:800;color:var(--text);letter-spacing:.2px;}
.he-tx i{font-style:normal;display:block;font-size:12px;color:var(--text-sub);margin-top:4px;line-height:1.5;}
.he-btn{margin-top:16px;width:100%;border:0;border-radius:14px;padding:13px;font-size:14.5px;font-weight:700;
  color:#fff;font-family:inherit;cursor:pointer;touch-action:manipulation;
  background:linear-gradient(135deg,var(--btn1,var(--primary)),var(--btn2,var(--accent)));
  box-shadow:0 12px 24px -14px var(--primary);}
.he-btn:active{transform:scale(.98);}
.hero-mark{display:none;}

.home-foot{text-align:center;font-size:11px;color:var(--text-sub);opacity:.6;
  letter-spacing:.4px;margin:6px 0 4px;}
.sec-head{font-size:17px;font-weight:800;color:var(--text);margin:6px 4px 12px;letter-spacing:.4px;}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 22px;}
.stat{background:var(--card);border-radius:18px;padding:16px 16px 14px;box-shadow:var(--card-shadow);}
.stat b{display:block;font-size:28px;font-weight:800;color:var(--text);line-height:1.15;
  font-variant-numeric:tabular-nums;}
.stat span{display:block;font-size:12.5px;color:var(--text-sub);margin-top:4px;}
.stat.tap{cursor:pointer;touch-action:manipulation;}
.stat.tap:active{transform:scale(.98);}

/* 功能宫格 */
.feat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0 0 22px;}
@media (min-width:768px){.feat-grid{grid-template-columns:repeat(4,1fr);}}
.fg{display:flex;flex-direction:column;gap:11px;background:var(--card);border:0;
  border-radius:18px;box-shadow:var(--card-shadow);padding:16px 15px;cursor:pointer;
  touch-action:manipulation;user-select:none;transition:transform .12s ease;}
.fg-tx{display:flex;flex-direction:column;gap:3px;min-width:0;}
.fg:active{transform:scale(.97);}
.fg-ico{width:44px;height:44px;border-radius:15px;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));
  box-shadow:0 12px 22px -12px var(--c2);}
.fg b{font-size:14.5px;font-weight:700;letter-spacing:.2px;line-height:1.2;color:var(--text);}
.fg i{font-style:normal;font-size:11.5px;color:var(--text-sub);line-height:1.45;}
@media (max-width:767px){
  .feat-grid .fg:last-child:nth-child(odd){grid-column:1/-1;flex-direction:row;align-items:center;
    gap:14px;padding:14px 17px;}
}

.sec-label{font-size:11.5px;font-weight:700;color:var(--text-sub);letter-spacing:1.4px;
  margin:2px 4px 10px;opacity:.85;}
.bank-tools{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:0 0 18px;}
.bank-tools .bt-item:last-child:nth-child(odd){grid-column:1/-1;}
.bt-item{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--card);border:0;
  border-radius:14px;padding:12px 14px;font-size:13.5px;font-weight:600;color:var(--text);
  cursor:pointer;touch-action:manipulation;user-select:none;box-shadow:var(--card-shadow);
  transition:transform .12s ease,background .12s ease;}
.bt-item:active{background:var(--primary-soft);transform:scale(.97);}
.bt-item svg{flex-shrink:0;opacity:.85;}

/* ===== 关于 / 版本 ===== */
.about-label{font-size:12.5px;font-weight:600;color:var(--text-sub);letter-spacing:.4px;}
.ver-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;}
.ver-row .btn{flex-shrink:0;margin-left:auto;}
.ver-line{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 4px;
  font-size:14px;color:var(--text-sub);min-width:0;}
.ver-line .vl{color:var(--text-sub);}
.ver-line .vv{font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:.3px;}
.ver-line .vv.warn{color:var(--warn);}
.ver-line .vv.dim{color:var(--text-sub);font-weight:600;opacity:.6;}
.ver-line .vs{color:var(--text-sub);opacity:.4;margin:0 3px;}
.about-hint{font-size:13px;line-height:1.8;color:var(--text-sub);margin-top:8px;}
/* 存储占用 */
.st-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:11px;}
.st-k{flex:none;font-size:12.5px;color:var(--text-sub);}
.st-v{flex:1;min-width:0;text-align:right;font-size:12.5px;color:var(--text-sub);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-v b{font-size:15px;font-weight:800;color:var(--text);letter-spacing:-.2px;}
.st-v i{font-style:normal;}
.st-v em{font-style:normal;opacity:.72;font-size:11.5px;}
.st-bar{height:6px;border-radius:999px;background:var(--primary-soft);margin-top:7px;overflow:hidden;}
.st-bar i{display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,var(--btn1,var(--primary)),var(--btn2,var(--accent)));}
.snap-meta{font-size:12.5px;color:var(--text-sub);font-variant-numeric:tabular-nums;}
.score-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--card-border);
  border-radius:14px;padding:11px 14px;margin:8px 0;}
.sr-name{flex:1;min-width:0;font-size:14px;color:var(--text);line-height:1.4;}
.sr-input{width:86px;flex:none;text-align:right;padding:8px 10px;font-size:15px;font-weight:700;color:var(--primary);}
.sr-unit{flex:none;font-size:12.5px;color:var(--text-sub);}
.ea-tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--primary);
  background:var(--primary-soft);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px;}
.about-foot{text-align:center;font-size:11.5px;color:var(--text-sub);opacity:.7;margin:22px 0 10px;letter-spacing:.4px;}
.theme-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px;}
@media (max-width:479px){.theme-grid{grid-template-columns:repeat(2,1fr);}}
.theme-opt{position:relative;border:1.5px solid var(--card-border);border-radius:16px;padding:8px 8px 9px;
  cursor:pointer;touch-action:manipulation;user-select:none;background:var(--card-solid,#fff);
  transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease;}
.theme-opt:active{transform:scale(.97);}
.theme-opt.on{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft);}
.tp{position:relative;height:58px;border-radius:11px;overflow:hidden;display:block;}
.tp-card{position:absolute;left:9px;right:9px;top:11px;bottom:9px;border-radius:7px;
  box-shadow:0 2px 6px rgba(0,0,0,.10);padding:7px 7px 0;display:flex;flex-direction:column;gap:5px;}
.tp-line{display:block;height:4px;border-radius:2px;width:62%;opacity:.9;}
.tp-line.s{width:38%;opacity:.38;}
.tp-pill{position:absolute;left:16px;bottom:13px;width:20px;height:6px;border-radius:4px;}
.tp-dot{position:absolute;right:16px;bottom:12px;width:8px;height:8px;border-radius:50%;
  box-shadow:0 0 0 1.5px rgba(255,255,255,.75);}
.to-name{font-size:13.5px;font-weight:700;color:var(--text);margin-top:7px;text-align:center;}
.to-desc{font-size:11px;color:var(--text-sub);text-align:center;margin-top:1px;}
.theme-opt.on .to-name{color:var(--primary);}
.to-check{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;
  background:var(--primary);color:#fff;font-size:11px;line-height:18px;text-align:center;font-weight:700;
  box-shadow:0 2px 6px rgba(0,0,0,.18);}

/* ===== 模块列表 ===== */
.mod-tools{display:flex;align-items:stretch;margin:12px 0 0;background:var(--card);
  border:1px solid var(--card-border);border-radius:14px;overflow:hidden;box-shadow:var(--card-shadow);}
.mt-seg{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;
  border:0;border-right:1px solid var(--line);background:none;padding:12px 6px;
  font-family:inherit;font-size:12px;font-weight:600;color:var(--text);line-height:1.3;
  cursor:pointer;touch-action:manipulation;white-space:nowrap;}
.mt-seg:last-child{border-right:0;}
.mt-seg:active{background:var(--primary-soft);}
.mt-seg.on{color:var(--primary);background:var(--primary-soft);}
.mt-seg svg{flex:none;opacity:.8;}
.mt-seg .fp-tx{min-width:0;overflow:hidden;text-overflow:ellipsis;}
.mt-seg .fp-arrow{flex:none;font-size:9px;opacity:.6;line-height:1;margin-left:-1px;}
/* 类别选择弹窗 */
.pick-list{margin-top:4px;}
.pick-item{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:14px 2px;font-size:15px;color:var(--text);cursor:pointer;
  touch-action:manipulation;border-bottom:1px solid var(--line);}
.pick-item:last-child{border-bottom:0;}
.pick-item:active{opacity:.6;}
.pick-item.on{color:var(--primary);font-weight:700;}
.pick-ck{color:var(--primary);font-weight:800;font-size:15px;}
.mod-tip{font-size:11.5px;color:var(--text-sub);margin:9px 4px 10px;letter-spacing:.2px;}
.stat-strip{display:flex;gap:10px;margin:12px 0;}
.stat-strip .ss{flex:1;background:var(--card);border:1px solid var(--card-border);border-radius:16px;
  box-shadow:var(--card-shadow);padding:13px 6px;text-align:center;}
.stat-strip .ss .n{font-size:21px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;}
.stat-strip .ss .l{font-size:11px;color:var(--text-sub);margin-top:2px;letter-spacing:.3px;}
.mod-card{display:flex;align-items:center;gap:12px;}
.mod-card .m-name{font-weight:700;font-size:15.5px;letter-spacing:.2px;}
.mod-card .m-nums{font-size:12.5px;color:var(--text-sub);margin-top:3px;}
.mod-card .m-nums b{color:var(--primary);font-weight:800;}
.mod-card .m-right{margin-left:auto;font-size:22px;color:var(--text-sub);opacity:.45;flex-shrink:0;
  line-height:1;padding-left:4px;}
.mod-card.ready .m-right{color:var(--primary);opacity:1;}
.mod-card.disabled{opacity:.5;}
.plan-line{font-size:13px;color:var(--teal);margin-top:4px;}

/* ===== 答题页 ===== */
.exam-meta{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0 2px;}
.q-count{font-size:13px;color:var(--text-sub);margin:10px 0 2px;letter-spacing:.3px;}
.q-count b{color:var(--primary);font-weight:800;font-size:15px;}
.opts{display:grid;gap:10px;margin:14px 0 4px;}
@media (min-width:768px){.opts{grid-template-columns:1fr 1fr;}}
.opt{display:flex;gap:11px;align-items:flex-start;padding:14px 15px;border:1.5px solid var(--card-border);
  border-radius:16px;background:var(--card);cursor:pointer;touch-action:manipulation;user-select:none;
  font-size:15.5px;line-height:1.65;word-break:break-word;
  transition:transform .12s ease,border-color .12s ease,background .12s ease,box-shadow .12s ease;}
.opt:active{transform:scale(.99);}
.opt-badge{min-width:30px;width:30px;height:30px;border-radius:11px;background:var(--primary-soft);
  color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;
  font-size:14px;flex-shrink:0;margin-top:0;transition:background .12s ease,color .12s ease;}
.opt.sel{border-color:var(--primary);background:var(--primary-soft);box-shadow:0 0 0 3px var(--primary-soft);}
.opt.sel .opt-badge{background:var(--primary);color:#fff;}
.opt.ok{border-color:var(--ok);background:var(--ok-bg);}
.opt.ok .opt-badge{background:var(--ok);color:#fff;}
.opt.err{border-color:var(--err);background:var(--err-bg);}
.opt.err .opt-badge{background:var(--err);color:#fff;}
.opt.ans-outline{border-color:var(--ok);background:var(--ok-bg);}
.opt.ans-outline .opt-badge{background:var(--ok);color:#fff;}
.opt .tag-mine{font-size:12px;color:var(--ok);border:1px solid currentColor;border-radius:6px;
  padding:1px 6px;margin-left:8px;white-space:nowrap;align-self:center;}
.opt.err .tag-mine{color:var(--err);}
.opt.static{cursor:default;}
.verdict{font-weight:700;margin:12px 0 4px;font-size:16px;}
.verdict.v-ok{color:var(--ok);}
.verdict.v-err{color:var(--err);}
.multi-submit-bar{margin:14px 0 4px;}
.timer{font-size:26px;font-weight:700;letter-spacing:1px;
  background:linear-gradient(135deg,var(--primary),var(--accent));color:var(--primary);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.timer.urgent{background:linear-gradient(135deg,var(--coral),var(--err));color:var(--err);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}

/* ===== 题号导航 ===== */
.qgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.qn{min-width:42px;height:42px;padding:0 6px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;
  font-size:15px;cursor:pointer;touch-action:manipulation;user-select:none;}
.qn.ans{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);}
.qn.cur{box-shadow:0 0 0 2px var(--primary);}
.qn.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
.qn.err{background:var(--err-bg);border-color:var(--err);color:var(--err);}
.qn.un{background:var(--qn-un,#f3f7f8);color:var(--text-sub);}
.qn.static{cursor:default;}
.qg-head{width:100%;font-size:13px;color:var(--text-sub);margin:6px 0 0 2px;}

/* ===== 结果页 ===== */
.res-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;text-align:center;margin:4px 0;}
.res-grid .rn{font-size:20px;font-weight:700;color:var(--primary);}
.res-grid .rl{font-size:11px;color:var(--text-sub);}
.res-grid .rn.acc-hi{color:var(--ok);}
.res-grid .rn.acc-lo{color:var(--err);}
table.tmod{width:100%;border-collapse:collapse;font-size:14px;}
.tmod th,.tmod td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.tmod th{color:var(--text-sub);font-weight:600;font-size:13px;}
.tmod td.acc-ok{color:var(--ok);font-weight:700;}
.tmod td.acc-err{color:var(--err);font-weight:700;}

.pbar{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin-top:11px;}
.pbar-in{height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:999px;}
.ckbox{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;background:var(--card);margin-top:2px;}
.ckbox.on{background:var(--primary);border-color:var(--primary);}

/* ===== 弹窗 / 提示 ===== */
#toasts{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;z-index:300;
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px;}
.toast{max-width:92%;background:rgba(43,69,80,.92);color:#fff;font-size:14px;border-radius:12px;
  padding:10px 16px;box-shadow:0 6px 20px rgba(30,60,75,.25);}
.toast.ok{background:var(--ok);}
.toast.err{background:var(--err);}
.toast.warn{background:var(--warn);}
.mask{position:fixed;inset:0;background:rgba(43,69,80,.35);z-index:250;display:flex;
  align-items:center;justify-content:center;padding:20px;}
.modal{width:100%;max-width:440px;max-height:calc(100dvh - 60px);overflow:auto;
  background:var(--card-solid,#fff);border:1px solid var(--card-border);border-radius:16px;
  box-shadow:0 10px 40px rgba(30,60,75,.2);padding:18px;
  padding-top:calc(18px);}
.modal h3{margin:0 0 8px;font-size:17px;}
.modal .m-msg{font-size:15px;color:var(--text);white-space:pre-wrap;}
.modal .m-btns{display:flex;gap:10px;margin-top:16px;}
.modal .m-btns .btn{flex:1;}
.top-banner{position:fixed;left:0;right:0;top:0;z-index:240;
  padding:calc(6px + env(safe-area-inset-top)) 16px 6px;text-align:center;
  background:var(--warn);color:#fff;font-size:13px;cursor:pointer;touch-action:manipulation;}
pre.ex-pre{background:#f4fafb;border:1px solid var(--line);border-radius:10px;padding:10px;
  font-size:12.5px;white-space:pre-wrap;word-break:break-word;user-select:text;-webkit-user-select:text;
  max-height:220px;overflow:auto;-webkit-overflow-scrolling:touch;font-family:inherit;color:var(--text);}

/* ===== 导入页 ===== */
.mode-badge{display:inline-block;font-size:12px;padding:4px 10px;border-radius:999px;
  background:var(--chip-sub,#eef4f8);color:var(--text-sub);margin-right:8px;}
.mode-badge.pc{background:var(--primary-soft);color:var(--primary);}
.tabbar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0;}
.tabbar .tb{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:14px;color:var(--text-sub);cursor:pointer;touch-action:manipulation;user-select:none;}
.tabbar .tb.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.imp-item{border:1px solid var(--card-border);border-radius:12px;background:var(--card);margin:10px 0;overflow:hidden;}
.imp-item.fail{border-color:var(--err);background:var(--card);}
.imp-item.skip{opacity:.45;}
.imp-item .ii-head{display:flex;align-items:center;gap:8px;padding:10px 12px;cursor:pointer;
  touch-action:manipulation;user-select:none;}
.imp-item .ii-q{flex:1;font-size:14px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.imp-item .ii-body{padding:4px 12px 12px;border-top:1px solid var(--line);display:none;}
.imp-item.open .ii-body{display:block;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;}
@media (max-width:480px){.grid2{grid-template-columns:1fr;}}
.err-list{font-size:12.5px;color:var(--err);margin:6px 0;}
.ai-status{font-size:14px;margin-top:8px;color:var(--text-sub);white-space:pre-wrap;word-break:break-word;}
.file-note{font-size:13px;color:var(--text-sub);margin-top:8px;}

/* ===== 错题本 ===== */
.wrong-row .w-q{font-size:15px;line-height:1.6;}
.wrong-row .w-meta{font-size:13px;color:var(--text-sub);margin-top:6px;}
.wrong-row .w-meta b{color:var(--err);}
.fav-row .w-q{font-size:15px;line-height:1.6;}
.round-summary .rs{display:flex;gap:10px;text-align:center;}
.round-summary .rs>div{flex:1;}
.round-summary .rs .n{font-size:24px;font-weight:700;}
.round-summary .rs .n.g{color:var(--ok);}
.round-summary .rs .n.r{color:var(--err);}
.round-summary .rs .n.t{color:var(--teal);}
.miss-empty{text-align:center;color:var(--text-sub);padding:30px 10px;}

/* 详情页 */
.detail-ans-line{font-size:15px;margin:8px 0;}
.detail-ans-line b{font-weight:700;}
.detail-ans-line .da-ok{color:var(--ok);}
.detail-ans-line .da-err{color:var(--err);}
.detail-ans-line .da-un{color:var(--text-sub);}

/* ================= 标记 / 学习备注 / 热力图 / 打印 ================= */
.flag-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-left:6px;vertical-align:1px;}
.flag-dot.flag-red{background:#e0533d;}
.flag-dot.flag-blue{background:#3b82f6;}
.flag-dot.flag-green{background:#16a34a;}
.flag-row{display:flex;gap:8px;flex-wrap:wrap;}
.flag-btn{border:1px solid var(--card-border);background:var(--card);color:var(--text-sub);border-radius:9px;
  padding:6px 12px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;touch-action:manipulation;}
.flag-btn.flag-red{color:#e0533d;}
.flag-btn.flag-blue{color:#3b82f6;}
.flag-btn.flag-green{color:#16a34a;}
.flag-btn.on{background:var(--primary-soft);border-color:currentColor;}
.lc-note{width:100%;margin-top:9px;padding:8px 10px;border-radius:9px;border:1px solid var(--card-border);
  background:var(--card);color:var(--text);font-family:inherit;font-size:12px;box-sizing:border-box;}
.lc-note::placeholder{color:var(--text-sub);opacity:.7;}
.hm{display:grid;grid-template-columns:repeat(15,1fr);gap:4px;margin-top:11px;}
.hm i{display:block;aspect-ratio:1;border-radius:3px;background:var(--primary);opacity:.10;}
.hm i.l1{opacity:.32;}
.hm i.l2{opacity:.6;}
.hm i.l3{opacity:.92;}
.hm-legend{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:10.5px;
  color:var(--text-sub);margin-top:8px;}
.hm-legend b{display:block;width:11px;height:11px;border-radius:3px;background:var(--primary);}
#print-root{display:none;}
@media print{
  body > #app, body > #toasts, body > #modal-root, body > .botbar{display:none !important;}
  #print-root{display:block !important;color:#000;background:#fff;}
  #print-root h2{font-size:16pt;margin:0 0 6pt;}
  #print-root .pr-sub{font-size:9pt;color:#555;margin-bottom:12pt;}
  #print-root .pr-q{margin:0 0 11pt;page-break-inside:avoid;}
  #print-root .pr-q b{display:block;margin-bottom:3pt;font-size:11pt;}
  #print-root .pr-q .pr-o{margin-left:12pt;font-size:10pt;line-height:1.6;}
  #print-root .pr-q .pr-a{margin-top:3pt;font-size:10pt;}
}

/* ================= 间隔复习 / 学习报告 ================= */
.rp-hero{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 16px;}
.rp-cell{background:var(--card);border-radius:16px;box-shadow:var(--card-shadow);padding:13px 8px;text-align:center;}
.rp-cell b{display:block;font-size:20px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;letter-spacing:-.4px;}
.rp-cell span{font-size:11px;color:var(--text-sub);}
.rp-days{display:flex;align-items:flex-end;gap:6px;height:104px;margin-top:10px;}
.rp-day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%;}
.rp-day i{display:block;width:100%;border-radius:6px 6px 0 0;min-height:3px;
  background:linear-gradient(180deg,var(--btn2,var(--accent)),var(--btn1,var(--primary)));}
.rp-day span{font-size:10px;color:var(--text-sub);font-variant-numeric:tabular-nums;}
.rp-row{display:flex;align-items:center;gap:10px;margin-top:11px;}
.rp-m{width:86px;flex:none;font-size:12.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rp-bar{flex:1;height:8px;border-radius:999px;background:var(--primary-soft);overflow:hidden;}
.rp-bar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--btn1,var(--primary)),var(--btn2,var(--accent)));}
.rp-acc{width:44px;flex:none;text-align:right;font-size:12px;color:var(--text-sub);font-variant-numeric:tabular-nums;}
.rp-tip{font-size:12px;color:var(--text-sub);margin-top:12px;line-height:1.75;}

/* ================= 配图 / 材料 / 笔记 / 填空 / 搜索 ================= */
.q-img{display:block;max-width:100%;height:auto;border-radius:12px;margin-top:12px;}
.opt-img{display:block;max-width:100%;height:auto;border-radius:10px;margin-bottom:8px;}
.mat-box{margin-top:12px;border-radius:12px;background:var(--primary-soft);padding:0 14px;}
.mat-box summary{padding:11px 0;font-size:13px;font-weight:700;color:var(--primary);cursor:pointer;list-style:none;}
.mat-box summary::-webkit-details-marker{display:none;}
.mat-box summary::after{content:/▾/;float:right;opacity:.55;font-size:11px;transition:transform .15s;}
.mat-box[open] summary::after{transform:rotate(180deg);}
.mat-box[open] summary{border-bottom:1px solid var(--card-border);}
.mat-body{padding:11px 0 13px;font-size:14.5px;line-height:1.8;white-space:pre-wrap;color:var(--text);}
.q-note{margin-top:12px;border-left:3px solid var(--primary);padding:2px 0 2px 10px;
  font-size:13px;line-height:1.7;color:var(--text-sub);white-space:pre-wrap;}
.q-note b{display:block;font-size:11px;font-weight:700;color:var(--primary);margin-bottom:2px;letter-spacing:.5px;}
.blank-wrap{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
.blank-in{padding:12px 14px;font-size:15px;border-radius:12px;border:1.5px solid var(--card-border);
  background:var(--card);color:var(--text);font-family:inherit;width:100%;box-sizing:border-box;}
.blank-in.ok{border-color:var(--ok);background:var(--ok-bg);color:var(--ok);font-weight:700;}
.blank-in.err{border-color:var(--err);background:var(--err-bg);color:var(--err);font-weight:700;}
.sr-entry{display:block;width:100%;margin:12px 0 2px;padding:11px 14px;border:1.5px dashed var(--card-border);
  border-radius:12px;background:none;color:var(--text-sub);font-family:inherit;font-size:12.5px;
  text-align:left;cursor:pointer;touch-action:manipulation;}
.sr-entry:active{background:var(--primary-soft);}
.search-box{display:flex;gap:8px;margin:14px 0 12px;}
.search-box input{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1.5px solid var(--card-border);
  background:var(--card);color:var(--text);font-size:15px;font-family:inherit;}
.sr-item{padding:13px 14px;border-radius:14px;background:var(--card);box-shadow:var(--card-shadow);
  margin-bottom:10px;cursor:pointer;touch-action:manipulation;}
.sr-item:active{transform:scale(.99);}
.sr-q{font-size:14.5px;line-height:1.6;color:var(--text);word-break:break-word;}
.sr-meta{font-size:11.5px;color:var(--text-sub);margin-top:6px;}
.sr-hit{color:var(--primary);font-weight:800;background:var(--primary-soft);border-radius:3px;padding:0 2px;}
.sheet-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 2px;
  font-size:15px;color:var(--text);cursor:pointer;border-bottom:1px solid var(--line);touch-action:manipulation;}
.sheet-item:last-child{border-bottom:0;}
.sheet-item:active{opacity:.6;}
.sheet-item span.muted{font-size:11.5px;}

/* ================= 阅读字号 / 专注模式 / 答题卡 ================= */
html[data-fs="sm"] .q-text{font-size:15px;line-height:1.62;}
html[data-fs="sm"] .opt{font-size:14px;}
html[data-fs="sm"] .analysis{font-size:14px;}
html[data-fs="lg"] .q-text{font-size:19px;line-height:1.85;}
html[data-fs="lg"] .opt{font-size:17px;line-height:1.75;}
html[data-fs="lg"] .analysis{font-size:16px;}
.qc-row{display:flex;align-items:center;gap:8px;}
.qc-row .q-count{flex:1;min-width:0;}
.qc-focus{flex:none;border:0;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;
  font-family:inherit;background:var(--primary-soft);color:var(--primary);cursor:pointer;touch-action:manipulation;}
body.focus-mode .topbar,body.focus-mode .botbar{display:none!important;}
body.focus-mode #app{padding-bottom:26px;padding-top:calc(10px + env(safe-area-inset-top));}
body.focus-mode .focus-exit{display:block;}
body.focus-mode .qc-focus{display:none;}
.focus-exit{display:none;position:fixed;right:14px;top:calc(12px + env(safe-area-inset-top));z-index:70;border:0;
  border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;font-family:inherit;
  background:var(--primary);color:#fff;box-shadow:0 10px 20px -10px var(--primary);cursor:pointer;touch-action:manipulation;}
.qc-legend{display:flex;gap:14px;font-size:11.5px;color:var(--text-sub);margin-top:6px;}
.qc-legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:1px;}
.qc-legend .ok i{background:var(--ok);}
.qc-legend .err i{background:var(--err);}
.qc-legend .un i{background:var(--line);}
.fs-seg{display:flex;gap:6px;justify-content:flex-end;}
.fs-b{border:1px solid var(--card-border);background:var(--card);color:var(--text-sub);border-radius:9px;
  padding:5px 14px;font-size:12.5px;font-weight:700;font-family:inherit;cursor:pointer;touch-action:manipulation;}
.fs-b.on{background:var(--primary);border-color:var(--primary);color:#fff;}
.sec-head-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 4px 12px;}
.sec-head-row .sec-head{margin:0;}
.sec-sub{font-size:11.5px;color:var(--text-sub);letter-spacing:.3px;}

/* ================= 每日学习 ================= */
.learn-hero{margin:16px 0 18px;border-radius:22px;padding:17px 18px 15px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,var(--hero1,var(--primary)) 0%,var(--hero1,var(--primary)) 38%,var(--hero2,var(--accent)) 100%);
  box-shadow:0 20px 40px -24px var(--primary);}
.learn-hero::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 92% at 86% -18%,rgba(255,255,255,.30) 0%,rgba(255,255,255,0) 58%);}
.lh-k{font-size:12px;color:rgba(255,255,255,.84);letter-spacing:.5px;position:relative;z-index:1;}
.lh-n{font-size:36px;font-weight:800;color:#fff;line-height:1.05;margin-top:3px;letter-spacing:-1.2px;
  font-variant-numeric:tabular-nums;position:relative;z-index:1;}
.lh-n span{font-size:14px;font-weight:600;opacity:.72;margin-left:6px;letter-spacing:0;}
.lh-sub{font-size:12px;color:rgba(255,255,255,.82);margin-top:8px;line-height:1.6;position:relative;z-index:1;}
.lh-bar{height:6px;border-radius:999px;background:rgba(255,255,255,.22);margin-top:11px;overflow:hidden;position:relative;z-index:1;}
.lh-bar i{display:block;height:100%;border-radius:999px;background:#fff;}
.lh-week{display:flex;gap:5px;margin-top:12px;position:relative;z-index:1;}
.lh-week .lw-w{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px;}
.lh-week .lw{height:22px;border-radius:6px;background:rgba(255,255,255,.16);display:flex;align-items:flex-end;overflow:hidden;}
.lh-week .lw i{display:block;width:100%;background:rgba(255,255,255,.86);border-radius:5px 5px 0 0;}
.lh-week .lw-w span{font-size:9.5px;color:rgba(255,255,255,.62);text-align:center;line-height:1;
  font-variant-numeric:tabular-nums;}
.lh-foot{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;
  color:rgba(255,255,255,.82);margin-top:9px;position:relative;z-index:1;letter-spacing:.3px;}
.lc{background:var(--card);border-radius:16px;box-shadow:var(--card-shadow);padding:13px 14px 12px;margin-bottom:10px;}
.lc-head{display:flex;align-items:center;gap:9px;}
.lc-av{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--primary-soft);color:var(--primary);font-size:14px;font-weight:800;}
.lc-name{flex:1;min-width:0;font-size:14.5px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lc-num{flex:none;font-size:12px;color:var(--text-sub);font-variant-numeric:tabular-nums;}
.lc-num b{font-size:15px;font-weight:800;color:var(--primary);}
.lc-more{flex:none;width:26px;height:26px;border:0;border-radius:8px;background:none;color:var(--text-sub);
  font-size:16px;line-height:1;cursor:pointer;touch-action:manipulation;padding:0;}
.lc-more:active{background:var(--primary-soft);}
.lc-bar{height:5px;border-radius:999px;background:var(--primary-soft);margin-top:9px;overflow:hidden;}
.lc-bar i{display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,var(--btn1,var(--primary)),var(--btn2,var(--accent)));}
.lc-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;}
.lc-tip{font-size:11.5px;color:var(--text-sub);opacity:.85;}
.lc-acts{display:flex;gap:6px;flex:none;}
.lc-btn{height:30px;min-width:30px;padding:0 9px;border:0;border-radius:10px;background:var(--primary-soft);
  color:var(--primary);font-family:inherit;font-size:14px;font-weight:800;line-height:1;cursor:pointer;
  touch-action:manipulation;}
.lc-btn:active{transform:scale(.94);}
.lc-btn.plus{background:linear-gradient(135deg,var(--btn1,var(--primary)),var(--btn2,var(--accent)));color:#fff;
  font-size:12.5px;padding:0 12px;}
.lp-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.lp-item{display:flex;align-items:center;gap:6px;border:0;border-radius:12px;padding:9px 12px;
  background:var(--primary-soft);color:var(--primary);font-family:inherit;font-size:13px;font-weight:600;
  cursor:pointer;touch-action:manipulation;}
.lp-item:active{transform:scale(.97);}
.lp-item i{font-style:normal;opacity:.65;font-size:11.5px;font-weight:600;}
@media (max-width:767px){.feat-grid{grid-template-columns:1fr 1fr;}}

/* ================= 多端自适应（手机 / 平板 / 电脑） ================= */
/* 内容宽度：一处定义，顶栏底栏共用 */
:root{--shell:720px;}
@media (min-width:768px){:root{--shell:860px;}}
@media (min-width:1100px){:root{--shell:1020px;}}
#app{max-width:var(--shell);}
.botbar-in{max-width:var(--shell);}

/* 手机横屏 / 平板竖屏：留白与栏数 */
@media (min-width:768px){
  #app{padding-left:calc(24px + env(safe-area-inset-left));
       padding-right:calc(24px + env(safe-area-inset-right));}
  .feat-grid{grid-template-columns:repeat(4,1fr);}
  /* 7 个功能卡在四列下会空半行，最后一张跨两列补满 */
  .feat-grid .fg:last-child:nth-child(odd){grid-column:span 2;flex-direction:row;
    align-items:center;justify-content:center;gap:14px;padding:18px 20px;}
  .feat-grid .fg:last-child:nth-child(odd) .fg-tx{flex:1;}
  .bank-tools{grid-template-columns:repeat(3,1fr);}
  .bank-tools .bt-item:last-child:nth-child(odd){grid-column:auto;}
  .home-row h1{font-size:34px;}
  .hero-num{font-size:52px;}
  .hero{padding:24px 24px 24px;}
  .hero-empty{padding:24px;}
  .sec-head{font-size:18px;}
  .mod-list{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .mod-list .card{margin:0;}
  #quiz-body{max-width:780px;margin-left:auto;margin-right:auto;}
  .botbar-in{padding-left:24px;padding-right:24px;}
}

/* 平板 / 电脑：顶栏底栏底色铺满整个视口，不再只覆盖内容区 */
@media (min-width:820px){
  /* 顶栏底色铺满视口：用 box-shadow 向外铺（纯绘制，不产生横向溢出），
     再用 clip-path 只在水平方向放开，避免阴影盖住下方内容。
     不用 100vw —— 它会把滚动条宽度算进去，桌面端会多出约 8px 可横向拖动。 */
  .topbar{box-shadow:0 0 0 100vw var(--panel);clip-path:inset(0 -100vw);
    border-bottom:1px solid var(--line);}
  .topbar::before{display:none;}
  .botbar{background:var(--panel);box-shadow:0 -1px 0 var(--line);}
  .botbar-in{background:transparent;box-shadow:none;max-width:820px;}
}
/* 平板 / 电脑：首页改两栏（主卡在左，数据在右） */
@media (min-width:820px){
  .home-main{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);
    column-gap:26px;align-items:start;}
  .hm-a{padding-top:16px;}
  .hm-a .hero,.hm-a .hero-empty{margin:0;}
  .hm-b{padding-top:16px;}
  .hm-b .sec-head{margin:0 4px 12px;}
  .stat-grid{margin-bottom:0;}
  .sec-head:not(.hm-b .sec-head){margin-top:22px;}
}
/* 电脑：留白放大，工具一排五个 */
@media (min-width:1100px){
  #app{padding-left:28px;padding-right:28px;}
  .botbar-in{padding-left:28px;padding-right:28px;}
  .bank-tools{grid-template-columns:repeat(5,1fr);}
  .feat-grid{gap:14px;margin-bottom:26px;}
  .fg{padding:18px 17px;}
  .fg-ico{width:46px;height:46px;}
  .bank-tools .bt-item{padding:13px 12px;}
  /* 悬停反馈（仅指针设备） */
  @media (hover:hover){
    .fg:hover{transform:translateY(-2px);}
    .bt-item:hover,.stat.tap:hover{background:var(--primary-soft);}
    .mt-seg:hover{background:var(--primary-soft);}
  }
}
@media (min-width:1100px) and (hover:hover){
  .fg{transition:transform .15s ease,box-shadow .15s ease;}
  .fg:hover{box-shadow:0 16px 32px -18px rgba(30,60,45,.45);}
}
/* 超宽屏：内容不再拉长，行高更舒服 */
@media (min-width:1600px){
  :root{--shell:1120px;}
}
/* 手机横屏时压缩纵向留白 */
@media (orientation:landscape) and (max-height:520px){
  .home-top{padding-top:calc(10px + env(safe-area-inset-top));}
  .hero,.hero-empty{margin-top:10px;margin-bottom:14px;padding:16px;}
  .hero-num{font-size:38px;}
}
</style>
